AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Q2 CloudFormation template for a To-Do microservices application.
  It creates networking, ECR repositories, ECS Fargate services,
  task definitions, IAM role, security groups and an Application Load Balancer.

Parameters:

  AppName:
    Type: String
    Default: todo-ke
    Description: Application name used for resource naming

  FrontendContainerPort:
    Type: Number
    Default: 80

  BackendContainerPort:
    Type: Number
    Default: 5000

  FrontendImageUri:
    Type: String
    Default: 121861013072.dkr.ecr.ap-southeast-2.amazonaws.com/frontend-ke:latest
    Description: ECR image URI for the frontend

  BackendImageUri:
    Type: String
    Default: 121861013072.dkr.ecr.ap-southeast-2.amazonaws.com/backend-ke:latest
    Description: ECR image URI for the backend


Resources:

  # ---------------------------------------------------------
  # VPC
  # ---------------------------------------------------------

  TodoVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-vpc"


  # ---------------------------------------------------------
  # Public Subnets
  # ---------------------------------------------------------

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TodoVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-public-1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TodoVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-public-2"


  # ---------------------------------------------------------
  # Private Subnets
  # ---------------------------------------------------------

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TodoVPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-private-1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TodoVPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-private-2"


  # ---------------------------------------------------------
  # Internet Gateway
  # ---------------------------------------------------------

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-igw"

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref TodoVPC
      InternetGatewayId: !Ref InternetGateway


  # ---------------------------------------------------------
  # Public Route Table
  # ---------------------------------------------------------

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TodoVPC
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable


  # ---------------------------------------------------------
  # Private Route Table
  # ---------------------------------------------------------

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TodoVPC
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-private-rt"

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable


  # ---------------------------------------------------------
  # ECR Repositories
  # ---------------------------------------------------------

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AppName}-frontend-repo"
      ImageScanningConfiguration:
        ScanOnPush: true

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AppName}-backend-repo"
      ImageScanningConfiguration:
        ScanOnPush: true


  # ---------------------------------------------------------
  # ECS Cluster
  # ---------------------------------------------------------

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AppName}-cluster"


  # ---------------------------------------------------------
  # IAM Role
  # ---------------------------------------------------------

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy


  # ---------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from Internet to ALB
      VpcId: !Ref TodoVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0


  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ALB to access frontend service
      VpcId: !Ref TodoVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref FrontendContainerPort
          ToPort: !Ref FrontendContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup


  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ALB to access backend service
      VpcId: !Ref TodoVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref BackendContainerPort
          ToPort: !Ref BackendContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup


  # ---------------------------------------------------------
  # Frontend Task Definition
  # ---------------------------------------------------------

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AppName}-frontend"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn

      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImageUri
          Essential: true

          PortMappings:
            - ContainerPort: !Ref FrontendContainerPort
              Protocol: tcp


  # ---------------------------------------------------------
  # Backend Task Definition
  # ---------------------------------------------------------

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AppName}-backend"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn

      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImageUri
          Essential: true

          PortMappings:
            - ContainerPort: !Ref BackendContainerPort
              Protocol: tcp


  # ---------------------------------------------------------
  # Application Load Balancer
  # ---------------------------------------------------------

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AppName}-alb"
      Scheme: internet-facing
      Type: application

      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

      SecurityGroups:
        - !Ref ALBSecurityGroup


  # ---------------------------------------------------------
  # Frontend Target Group
  # ---------------------------------------------------------

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AppName}-front-tg"
      VpcId: !Ref TodoVPC

      Protocol: HTTP
      Port: !Ref FrontendContainerPort
      TargetType: ip

      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      Matcher:
        HttpCode: "200-399"


  # ---------------------------------------------------------
  # Backend Target Group
  # ---------------------------------------------------------

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AppName}-back-tg"
      VpcId: !Ref TodoVPC

      Protocol: HTTP
      Port: !Ref BackendContainerPort
      TargetType: ip

      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      Matcher:
        HttpCode: "200-399"


  # ---------------------------------------------------------
  # ALB Listener
  # ---------------------------------------------------------

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer

      Protocol: HTTP
      Port: 80

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup


  # ---------------------------------------------------------
  # Backend Path Rule
  # /api/* goes to Flask backend
  # ---------------------------------------------------------

  BackendListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 10

      Conditions:
        - Field: path-pattern
          Values:
            - "/api/*"

      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup


  # ---------------------------------------------------------
  # Frontend ECS Service
  # ---------------------------------------------------------

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListener

    Properties:
      ServiceName: !Sub "${AppName}-frontend-service"

      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref FrontendTaskDefinition

      DesiredCount: 1
      LaunchType: FARGATE

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED

          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2

          SecurityGroups:
            - !Ref FrontendSecurityGroup

      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: !Ref FrontendContainerPort
          TargetGroupArn: !Ref FrontendTargetGroup


  # ---------------------------------------------------------
  # Backend ECS Service
  # ---------------------------------------------------------

  BackendService:
    Type: AWS::ECS::Service
    DependsOn:
      - BackendListenerRule

    Properties:
      ServiceName: !Sub "${AppName}-backend-service"

      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref BackendTaskDefinition

      DesiredCount: 1
      LaunchType: FARGATE

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED

          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2

          SecurityGroups:
            - !Ref BackendSecurityGroup

      LoadBalancers:
        - ContainerName: backend
          ContainerPort: !Ref BackendContainerPort
          TargetGroupArn: !Ref BackendTargetGroup


# ---------------------------------------------------------
# Outputs
# ---------------------------------------------------------

Outputs:

  LoadBalancerDNS:
    Description: Public DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  ApplicationURL:
    Description: URL for the To-Do application
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"

  FrontendRepositoryURI:
    Description: CloudFormation-created frontend ECR repository
    Value: !GetAtt FrontendRepository.RepositoryUri

  BackendRepositoryURI:
    Description: CloudFormation-created backend ECR repository
    Value: !GetAtt BackendRepository.RepositoryUri